name = "nilpdf-feedback"
main = "index.js"
compatibility_date = "2024-01-01"

# Secrets (set via `wrangler secret put GITHUB_TOKEN`, never hardcode here):
#   GITHUB_TOKEN — GitHub PAT. Prefer a fine-grained token limited to this one
#                  repository with Issues: Read and write.
#
# After deploying, copy the Worker URL and set it as the FEEDBACK_ENDPOINT
# repository variable in GitHub Actions. The deploy job stamps it into
# assets/js/app.js over the __FEEDBACK_ENDPOINT__ placeholder. See the setup
# notes at the top of index.js.
