name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Least privilege by default. Pull requests run on our own hardware, so the
# jobs that run their code get read-only access and nothing else. Only the
# deploy job, which never runs for a pull request, asks for more.
permissions:
  contents: read

# A new push to a pull request cancels its superseded run, which matters on a
# small pool of shared self-hosted runners. Runs on main are keyed by commit, so
# a merge is never cancelled by the next one: every merge is tested.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs on our self-hosted runners, inside a container: the hosts are
# shared with other projects, and a container gives each job a clean, pinned
# environment instead of whatever is installed on the host. Container jobs ask
# for the `docker` label so they can only land on runners able to run them.
# tests/test_ci_config.py enforces all of this, and that actions stay pinned to
# commit SHAs.
jobs:
  lint:
    name: Lint (ruff, actionlint)
    runs-on: [self-hosted, docker]
    container:
      image: python:3.14-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ruff (undefined names, unused imports, syntax errors)
        run: |
          pip install --quiet "$(grep -E '^ruff==' requirements.txt)"
          ruff check .

      - name: actionlint (workflow syntax and expressions)
        run: |
          apt-get update -qq && apt-get install -y --no-install-recommends -qq curl ca-certificates >/dev/null
          curl -fsSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          actionlint -color

  test:
    name: Tests (Python 3.14, as in the browser)
    runs-on: [self-hosted, docker]
    container:
      image: python:3.14-slim
    timeout-minutes: 15
    steps:
      - name: Install git and Node.js (the JS syntax checks need Node)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends -qq git curl ca-certificates gnupg >/dev/null
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash - >/dev/null
          apt-get install -y --no-install-recommends -qq nodejs >/dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Unit tests, with an engine coverage floor
        # The floor (fail_under in pyproject.toml) fails the build if tests are
        # deleted or a large untested path is added to core/pdf_engine.py.
        run: python -m pytest tests/ --ignore=tests/e2e -v --tb=short --cov --cov-report=term

      - name: Verify SEO landing pages are in sync with generate_pages.py
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 generate_pages.py
          if ! git diff --exit-code; then
            echo "::error::generate_pages.py output does not match the committed landing pages." \
                 "Run 'python3 generate_pages.py' locally, review the diff, and commit the result."
            exit 1
          fi

  compat:
    name: Tests (Python ${{ matrix.python }})
    # The pip package supports Python 3.10 and up, but the browser only ever
    # runs 3.14. These cover the rest of the supported range.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    runs-on: [self-hosted, docker]
    container:
      image: python:${{ matrix.python }}-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest tests/ --ignore=tests/e2e -q --tb=short

  e2e:
    name: Browser tests (Chromium, real Pyodide)
    # The bugs unit tests can't see: a worker that never boots, a service worker
    # that breaks offline mode, UI state, the deploy stamping, and the engine
    # running on the actual WebAssembly builds of its libraries.
    runs-on: [self-hosted, docker]
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
    timeout-minutes: 25
    env:
      # The image's system Python is externally managed; this throwaway
      # container is the only thing pip writes to.
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      NILPDF_E2E: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prefer IPv4 for downloads
        # PyPI's hosts resolve to IPv6 as well as IPv4. On a host without an IPv6
        # route, pip sometimes picks the IPv6 address and fails outright instead
        # of falling back. Seen with Docker under WSL, which one of our runners is.
        run: echo 'precedence ::ffff:0:0/96  100' >> /etc/gai.conf
      - name: Install Python dependencies
        run: pip install -r requirements-e2e.txt
      - name: Browser tests
        run: python -m pytest tests/e2e -v --tb=short
      - name: Keep screenshots of failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failures
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 4

  deploy:
    name: Deploy to GitHub Pages
    # Every check has to pass before anything reaches nilpdf.com.
    needs: [lint, test, compat, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    # GitHub Pages allows one deployment at a time. Queue deploys rather than
    # race them; the newest queued deploy wins, and it contains every earlier
    # commit.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, docker]
    container:
      image: python:3.14-slim
    timeout-minutes: 10
    steps:
      - name: Install git (checkout needs it)
        run: apt-get update -qq && apt-get install -y --no-install-recommends -qq git >/dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Stamp the build version, cache name and feedback endpoint
        # The logic lives in scripts/stamp_build.py so tests/test_stamp_build.py
        # can test exactly what runs here.
        env:
          COMMIT_SHA: ${{ github.sha }}
          FEEDBACK_ENDPOINT: ${{ vars.FEEDBACK_ENDPOINT }}
        run: python3 scripts/stamp_build.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
