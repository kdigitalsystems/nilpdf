name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deploys instead of racing: GitHub Pages only allows one active
# deployment at a time, so when several pushes land close together (e.g. a
# burst of Dependabot merges), overlapping deploy-pages runs fail with
# "in progress deployment" errors. cancel-in-progress: false means each
# push still gets deployed, just queued rather than dropped.
concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

# Both jobs run on self-hosted runners inside a Docker container, rather than
# directly on the runner host. The host machine is shared across several
# other projects' CI, each with their own tool versions; running in a
# container gives this pipeline a clean, reproducible environment (fixed
# Python 3.11 + Node 20, nothing left over from a previous job) instead of
# depending on whatever happens to be globally installed on the shared host.
jobs:
  test:
    runs-on: self-hosted
    container:
      image: python:3.11-slim
    timeout-minutes: 10
    steps:
      - name: Install git and Node.js (bare Python image has neither)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git curl ca-certificates gnupg
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y --no-install-recommends nodejs

      - uses: actions/checkout@v7

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests with verbose output
        run: python -m pytest tests/ -v --tb=short

      - name: Verify SEO landing pages are in sync with generate_pages.py
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 generate_pages.py
          if ! git diff --exit-code; then
            echo "::error::generate_pages.py output does not match the committed landing pages." \
                 "Run 'python3 generate_pages.py' locally, review the diff, and commit the result."
            exit 1
          fi

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: self-hosted
    container:
      image: python:3.11-slim
    timeout-minutes: 10
    steps:
      - name: Install git (bare Python image doesn't have it, checkout needs it)
        run: apt-get update -qq && apt-get install -y --no-install-recommends git

      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Stamp build version and feedback token into index.html and sw.js
        env:
          COMMIT_SHA: ${{ github.sha }}
          FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import os, datetime
          sha  = os.environ['COMMIT_SHA'][:7]
          date = datetime.date.today().isoformat()
          ver  = f'{sha} {date}'

          # Stamp index.html (__BUILD_VERSION__ appears in the CSS link, the JS const, and the worker URL)
          html = open('index.html').read()
          if '__BUILD_VERSION__' not in html:
              print('ERROR: __BUILD_VERSION__ placeholder not found in index.html'); exit(1)
          html = html.replace('__BUILD_VERSION__', ver)
          print(f'index.html stamped: {ver}')

          # Stamp the feedback GitHub token (__GH_FEEDBACK_TOKEN__).
          # The token never touches the git repo — it exists only in the deployed
          # artifact. It must have public_repo scope only. If the secret is not set
          # the placeholder stays in place and the modal shows an "unavailable" error.
          fb_token = os.environ.get('FEEDBACK_GITHUB_TOKEN', '').strip()
          if fb_token:
              html = html.replace('__GH_FEEDBACK_TOKEN__', fb_token)
              print('Feedback token stamped.')
          else:
              print('WARNING: FEEDBACK_GITHUB_TOKEN secret not set — feedback form will show unavailable message.')

          open('index.html', 'w').write(html)

          # Stamp sw.js (__SW_VERSION__ is the cache name — changing it on every
          # deploy forces browsers to delete the old cache and fetch fresh files)
          sw = open('sw.js').read()
          if '__SW_VERSION__' not in sw:
              print('ERROR: __SW_VERSION__ placeholder not found in sw.js'); exit(1)
          open('sw.js', 'w').write(sw.replace('__SW_VERSION__', sha))
          print(f'sw.js cache name stamped: nilpdf-{sha}')
          EOF
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
