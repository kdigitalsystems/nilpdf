name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Least privilege by default. Pull requests run on our own hardware, so the
# jobs that run their code get read-only access and nothing else. Only the
# deploy job, which never runs for a pull request, asks for more.
permissions:
  contents: read

# A new push to a pull request cancels its superseded run, which matters on a
# small pool of shared self-hosted runners. Runs on main are keyed by commit, so
# a merge is never cancelled by the next one: every merge is tested.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# pip keeps no cache. In a container job its cache would go to a home directory
# the runner shares between all jobs, owned by root, and never be deleted.
env:
  PIP_NO_CACHE_DIR: "1"

# Every job runs on our self-hosted runners, inside a container: the hosts are
# shared with other projects, and a container gives each job a clean, pinned
# environment instead of whatever is installed on the host. Container jobs ask
# for the `docker` label so they can only land on runners able to run them.
#
# Every job ends by freeing the runner's disk, even when it fails. The
# container runs as root, and the runner doesn't, so the runner can't delete
# what a job leaves behind: it would pile up from run to run. The last step
# removes the checkout, everything root created in the runner's temp directory
# since the job started (the runner writes event.json as the job starts), and
# anything nilpdf left there in earlier runs.
#
# tests/test_ci_config.py enforces all of this, runs that last step against a
# mock runner, and checks that actions stay pinned to commit SHAs.
jobs:
  lint:
    name: Lint (ruff, actionlint)
    runs-on: [self-hosted, docker]
    container:
      image: python:3.14-slim
    timeout-minutes: 10
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install git and curl
        # actionlint finds the project by its .git directory. Without git in the
        # container, checkout falls back to a plain download with no .git.
        run: apt-get update -qq && apt-get install -y --no-install-recommends -qq git curl ca-certificates >/dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ruff (undefined names, unused imports, syntax errors)
        run: |
          pip install --quiet "$(grep -E '^ruff==' requirements.txt)"
          ruff check .

      - name: actionlint (workflow syntax and expressions)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          curl -fsSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          actionlint -color

      - name: Free the runner's disk space
        if: always()
        run: |
          find "${GITHUB_WORKSPACE:?}" -mindepth 1 -delete
          find "${RUNNER_TEMP:?}" -mindepth 1 -maxdepth 1 -user 0 \
            \( -name 'nilpdf-*' -o -newer "${GITHUB_EVENT_PATH:?}" \) -exec rm -rf {} +

  test:
    name: Tests (Python 3.14, as in the browser)
    runs-on: [self-hosted, docker]
    container:
      image: python:3.14-slim
    timeout-minutes: 15
    steps:
      - name: Install git and Node.js (the JS syntax checks need Node)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends -qq git curl ca-certificates gnupg >/dev/null
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash - >/dev/null
          apt-get install -y --no-install-recommends -qq nodejs >/dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Unit tests, with an engine coverage floor
        # The floor (fail_under in pyproject.toml) fails the build if tests are
        # deleted or a large untested path is added to core/pdf_engine.py.
        run: python -m pytest tests/ --ignore=tests/e2e -v --tb=short --cov --cov-report=term

      - name: Verify SEO landing pages are in sync with generate_pages.py
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 generate_pages.py
          if ! git diff --exit-code; then
            echo "::error::generate_pages.py output does not match the committed landing pages." \
                 "Run 'python3 generate_pages.py' locally, review the diff, and commit the result."
            exit 1
          fi

      - name: Free the runner's disk space
        if: always()
        run: |
          find "${GITHUB_WORKSPACE:?}" -mindepth 1 -delete
          find "${RUNNER_TEMP:?}" -mindepth 1 -maxdepth 1 -user 0 \
            \( -name 'nilpdf-*' -o -newer "${GITHUB_EVENT_PATH:?}" \) -exec rm -rf {} +

  compat:
    name: Tests (Python ${{ matrix.python }})
    # The pip package supports Python 3.10 and up, but the browser only ever
    # runs 3.14. These cover the rest of the supported range.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    runs-on: [self-hosted, docker]
    container:
      image: python:${{ matrix.python }}-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest tests/ --ignore=tests/e2e -q --tb=short

      - name: Free the runner's disk space
        if: always()
        run: |
          find "${GITHUB_WORKSPACE:?}" -mindepth 1 -delete
          find "${RUNNER_TEMP:?}" -mindepth 1 -maxdepth 1 -user 0 \
            \( -name 'nilpdf-*' -o -newer "${GITHUB_EVENT_PATH:?}" \) -exec rm -rf {} +

  e2e:
    name: Browser tests (Chromium, real Pyodide)
    # The bugs unit tests can't see: a worker that never boots, a service worker
    # that breaks offline mode, UI state, the deploy stamping, and the engine
    # running on the actual WebAssembly builds of its libraries.
    runs-on: [self-hosted, docker]
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
    timeout-minutes: 25
    env:
      # The image's system Python is externally managed; this throwaway
      # container is the only thing pip writes to.
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      NILPDF_E2E: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prefer IPv4 for downloads
        # PyPI's hosts resolve to IPv6 as well as IPv4. On a host without an IPv6
        # route, pip sometimes picks the IPv6 address and fails outright instead
        # of falling back. Seen with Docker under WSL, which one of our runners is.
        run: echo 'precedence ::ffff:0:0/96  100' >> /etc/gai.conf
      - name: Install Python dependencies
        run: pip install -r requirements-e2e.txt
      - name: Browser tests
        run: python -m pytest tests/e2e -v --tb=short
      - name: Keep screenshots of failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failures
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 4

      - name: Free the runner's disk space
        if: always()
        run: |
          find "${GITHUB_WORKSPACE:?}" -mindepth 1 -delete
          find "${RUNNER_TEMP:?}" -mindepth 1 -maxdepth 1 -user 0 \
            \( -name 'nilpdf-*' -o -newer "${GITHUB_EVENT_PATH:?}" \) -exec rm -rf {} +

  action:
    name: GitHub Action (Python ${{ matrix.python }})
    # Runs action.yml the way a workflow using it would, in clean containers at
    # both ends of the supported Python range: install from this checkout,
    # then check generated PDFs. tests/test_action.py covers the details.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    runs-on: [self-hosted, docker]
    container:
      image: python:${{ matrix.python }}-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make test PDFs, one clean and one with hidden text
        run: |
          pip install --quiet "$(grep -E '^pypdf==' requirements.txt)" "$(grep -E '^reportlab==' requirements.txt)"
          python3 - <<'EOF'
          import os, sys
          sys.path[:0] = ["tests", "."]
          from test_engine import box, make_line_pdf
          os.makedirs("action-fixtures/leaked", exist_ok=True)
          with open("action-fixtures/clean.pdf", "wb") as f:
              f.write(make_line_pdf())
          with open("action-fixtures/leaked/filing.pdf", "wb") as f:
              f.write(make_line_pdf(draw=box(0, 0, 0)))
          EOF

      - name: A clean PDF passes
        id: clean
        uses: ./
        with:
          paths: action-fixtures/clean.pdf

      - name: Hidden text fails the step
        id: leaked
        continue-on-error: true
        uses: ./
        with:
          paths: action-fixtures

      - name: With fail-on-hidden-text false, it reports and passes
        id: report_only
        uses: ./
        with:
          paths: action-fixtures/**/*.pdf
          fail-on-hidden-text: "false"

      - name: The outcomes and outputs are as documented
        env:
          CLEAN: ${{ toJSON(steps.clean.outputs) }}
          LEAKED: ${{ toJSON(steps.leaked.outputs) }}
          LEAKED_OUTCOME: ${{ steps.leaked.outcome }}
          REPORT_ONLY: ${{ toJSON(steps.report_only.outputs) }}
        run: |
          python3 - <<'EOF'
          import json, os
          clean, leaked, report_only = (json.loads(os.environ[k]) for k in ("CLEAN", "LEAKED", "REPORT_ONLY"))
          assert os.environ["LEAKED_OUTCOME"] == "failure", os.environ["LEAKED_OUTCOME"]
          assert clean["hidden-text-found"] == "false" and clean["files-checked"] == "1", clean
          assert leaked["hidden-text-found"] == "true" and leaked["files-checked"] == "2", leaked
          assert leaked["files-with-hidden-text"] == "1", leaked
          assert report_only["hidden-text-found"] == "true" and report_only["files-checked"] == "2", report_only
          with open(leaked["report"], encoding="utf-8") as f:
              report = json.load(f)
          assert [r["path"] for r in report["files"] if r.get("hidden_text_found")] == ["action-fixtures/leaked/filing.pdf"]
          # Each of the three runs removed its virtual environment when it finished.
          started = os.path.getmtime(os.environ["GITHUB_EVENT_PATH"])
          temp = os.environ["RUNNER_TEMP"]
          left = [d for d in os.listdir(temp)
                  if d.startswith("nilpdf-action.") and os.path.getmtime(os.path.join(temp, d)) > started]
          assert not left, f"virtual environments left on the runner: {left}"
          print("Outcomes and outputs are as documented, and nothing was left on the runner.")
          EOF

      - name: Free the runner's disk space
        if: always()
        run: |
          find "${GITHUB_WORKSPACE:?}" -mindepth 1 -delete
          find "${RUNNER_TEMP:?}" -mindepth 1 -maxdepth 1 -user 0 \
            \( -name 'nilpdf-*' -o -newer "${GITHUB_EVENT_PATH:?}" \) -exec rm -rf {} +

  deploy:
    name: Deploy to GitHub Pages
    # Every check has to pass before anything reaches nilpdf.com.
    needs: [lint, test, compat, e2e, action]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    # GitHub Pages allows one deployment at a time. Queue deploys rather than
    # race them; the newest queued deploy wins, and it contains every earlier
    # commit.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, docker]
    container:
      image: python:3.14-slim
    timeout-minutes: 10
    steps:
      - name: Install git (checkout needs it)
        run: apt-get update -qq && apt-get install -y --no-install-recommends -qq git >/dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Stamp the build version, cache name and feedback endpoint
        # The logic lives in scripts/stamp_build.py so tests/test_stamp_build.py
        # can test exactly what runs here.
        env:
          COMMIT_SHA: ${{ github.sha }}
          FEEDBACK_ENDPOINT: ${{ vars.FEEDBACK_ENDPOINT }}
        run: python3 scripts/stamp_build.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Free the runner's disk space
        if: always()
        run: |
          find "${GITHUB_WORKSPACE:?}" -mindepth 1 -delete
          find "${RUNNER_TEMP:?}" -mindepth 1 -maxdepth 1 -user 0 \
            \( -name 'nilpdf-*' -o -newer "${GITHUB_EVENT_PATH:?}" \) -exec rm -rf {} +
