name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deploys instead of racing: GitHub Pages only allows one active
# deployment at a time, so when several pushes land close together (e.g. a
# burst of Dependabot merges), overlapping deploy-pages runs fail with
# "in progress deployment" errors. cancel-in-progress: false means each
# push still gets deployed, just queued rather than dropped.
concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

# Both jobs run on self-hosted runners inside a Docker container, rather than
# directly on the runner host. The host machine is shared across several
# other projects' CI, each with their own tool versions; running in a
# container gives this pipeline a clean, reproducible environment (fixed
# Python 3.11 + Node 20, nothing left over from a previous job) instead of
# depending on whatever happens to be globally installed on the shared host.
jobs:
  test:
    runs-on: self-hosted
    container:
      image: python:3.11-slim
    timeout-minutes: 10
    steps:
      - name: Install git and Node.js (bare Python image has neither)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git curl ca-certificates gnupg
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y --no-install-recommends nodejs

      - uses: actions/checkout@v7

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests with verbose output
        run: python -m pytest tests/ -v --tb=short

      - name: Verify SEO landing pages are in sync with generate_pages.py
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 generate_pages.py
          if ! git diff --exit-code; then
            echo "::error::generate_pages.py output does not match the committed landing pages." \
                 "Run 'python3 generate_pages.py' locally, review the diff, and commit the result."
            exit 1
          fi

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: self-hosted
    container:
      image: python:3.11-slim
    timeout-minutes: 10
    steps:
      - name: Install git (bare Python image doesn't have it, checkout needs it)
        run: apt-get update -qq && apt-get install -y --no-install-recommends git

      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Stamp build version and feedback endpoint into index.html, app.js and sw.js
        env:
          COMMIT_SHA: ${{ github.sha }}
          FEEDBACK_ENDPOINT: ${{ vars.FEEDBACK_ENDPOINT }}
        run: |
          python3 - <<'EOF'
          import os, datetime
          sha  = os.environ['COMMIT_SHA'][:7]
          date = datetime.date.today().isoformat()
          ver  = f'{sha} {date}'

          # Stamp __BUILD_VERSION__ into index.html (the CSS link and the app.js
          # script tag) and into assets/js/app.js (the version const and the
          # pdf_worker.js URL). Both files must carry it, so a missing placeholder
          # in either one is a hard failure rather than a silently stale asset URL.
          for path in ('index.html', 'assets/js/app.js'):
              text = open(path).read()
              if '__BUILD_VERSION__' not in text:
                  print(f'ERROR: __BUILD_VERSION__ placeholder not found in {path}'); exit(1)
              open(path, 'w').write(text.replace('__BUILD_VERSION__', ver))
              print(f'{path} stamped: {ver}')

          # Stamp the feedback relay endpoint (__FEEDBACK_ENDPOINT__) into app.js.
          # This is the public URL of the Cloudflare Worker in feedback-worker/, which
          # is what actually holds the GitHub token. No credential is ever stamped into
          # the deployed site: everything served to a browser is world-readable, so a
          # token in the page would be a published token. If the variable is not set,
          # the placeholder stays and the modal shows an "unavailable" message.
          endpoint = os.environ.get('FEEDBACK_ENDPOINT', '').strip()
          app = open('assets/js/app.js').read()
          if endpoint:
              if '__FEEDBACK_ENDPOINT__' not in app:
                  print('ERROR: __FEEDBACK_ENDPOINT__ placeholder not found in assets/js/app.js'); exit(1)
              open('assets/js/app.js', 'w').write(app.replace('__FEEDBACK_ENDPOINT__', endpoint))
              print(f'Feedback endpoint stamped: {endpoint}')
          else:
              print('WARNING: FEEDBACK_ENDPOINT variable not set — feedback form will show unavailable message.')

          # Stamp sw.js (__SW_VERSION__ is the cache name — changing it on every
          # deploy forces browsers to delete the old cache and fetch fresh files)
          sw = open('sw.js').read()
          if '__SW_VERSION__' not in sw:
              print('ERROR: __SW_VERSION__ placeholder not found in sw.js'); exit(1)
          open('sw.js', 'w').write(sw.replace('__SW_VERSION__', sha))
          print(f'sw.js cache name stamped: nilpdf-{sha}')
          EOF
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
