name: Release to PyPI

# Pushing a version tag (v1.2.3) builds, verifies and publishes the `nilpdf`
# package. It can also be run by hand from main for an existing tag, which is
# how a tag pushed before this workflow existed gets published, and with
# publish unticked it is a dry run that does everything except the upload.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.1.0"
        required: true
        type: string
      publish:
        description: "Upload to PyPI. Leave unticked for a dry run that builds and checks everything."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Test, build and verify
    runs-on: [self-hosted, docker]
    container:
      image: python:3.14-slim
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Install git and Node.js
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends -qq git curl ca-certificates gnupg >/dev/null
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash - >/dev/null
          apt-get install -y --no-install-recommends -qq nodejs >/dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: The tag must match the package version and be on main
        id: version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(sed -nE 's/^__version__ = "([^"]+)"$/\1/p' python/nilpdf/__init__.py)
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match __version__ $version in python/nilpdf/__init__.py."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$RELEASE_TAG is not on main. Releases are cut from merged, tested code only."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing nilpdf $version from $(git rev-parse --short HEAD)"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install build==1.6.1 twine==7.0.0

      - name: Unit tests at the tagged commit
        run: python -m pytest tests/ --ignore=tests/e2e -q --tb=short

      - name: Build the sdist and wheel
        run: python -m build --outdir dist/

      - name: Check the distributions
        run: |
          twine check --strict dist/*
          version=${{ steps.version.outputs.version }}
          test -f "dist/nilpdf-$version-py3-none-any.whl"
          test -f "dist/nilpdf-$version.tar.gz"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Install the exact wheel being released, and run it
        # A clean virtualenv, with dependencies resolved from PyPI the way a
        # user's `pip install nilpdf` will.
        run: |
          python -m venv /tmp/release-smoke
          /tmp/release-smoke/bin/pip install --quiet dist/*.whl
          test "$(/tmp/release-smoke/bin/nilpdf --version)" = "nilpdf ${{ steps.version.outputs.version }}"
          /tmp/release-smoke/bin/python - <<'EOF'
          import io, subprocess, sys
          from pypdf import PdfWriter
          w = PdfWriter(); w.add_blank_page(width=200, height=200)
          buf = io.BytesIO(); w.write(buf)
          r = subprocess.run(["/tmp/release-smoke/bin/nilpdf", "check-redaction", "-"], input=buf.getvalue(), capture_output=True)
          print(r.stdout.decode(), r.stderr.decode())
          sys.exit(0 if r.returncode == 0 else 1)
          EOF

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 4

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' || inputs.publish
    # Self-hosted like everything else. The publish action starts its own Docker
    # container, so this job runs on the runner host rather than inside one, and
    # asks for a runner with Docker. The action's maintainers describe trusted
    # publishing from self-hosted runners as expected to work but best effort.
    runs-on: [self-hosted, docker]
    timeout-minutes: 15
    # PyPI only accepts tokens from this workflow file running in this
    # environment (the trusted publisher configured on pypi.org), and the
    # environment only allows the main branch and v* tags.
    environment:
      name: pypi
      url: https://pypi.org/project/nilpdf/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Clear the workspace
        # Container jobs run as root and leave root-owned files in this repo's
        # workspace on the runner, including .github/. This job runs on the host
        # as the runner user, and the publish action writes to .github/.tmp, so
        # without this it fails with "Permission denied" (as v0.1.1 first did).
        # The runner user can't delete root's files; a container can.
        run: docker run --rm -v "$GITHUB_WORKSPACE:/w" python:3.14-slim find /w -mindepth 1 -delete

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
